---
layout: default
---
<section class="page-shell shell narrow">
  <header class="page-header">
    {% if page.kicker %}<span class="eyebrow">{{ page.kicker }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</section>
